command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: CATALOG_NAME
    value: "lr_dev_aws_us_catalog"
  - name: SCHEMA_NAME
    value: "claim_to_confidence"
  - name: WAREHOUSE_ID
    value: "a3b61648ea4809e3"
  - name: FM_ENDPOINT
    value: "databricks-claude-sonnet-5"
  - name: ENTITY_NAME
    value: "Bricksurance SE"
  - name: HUB_APP_URL
    value: "https://actuarial-workbench-7474656169654171.aws.databricksapps.com"
  # Scenario id for the mutable presenter state (spec §6).
  - name: SCENARIO_ID
    value: "SC-BASE"
  # Genie space id (spec §3A/§3H). Empty until the space is created with tools/genie_space.py;
  # the Discover screen then shows a documented setup path instead of a native link.
  - name: GENIE_SPACE_ID
    value: ""
  # Presenter-utility token (spec §6). Change from the default before any shared run; the
  # POST mutation endpoints require it, keeping them off the audience path.
  - name: PRESENTER_TOKEN
    value: "present"
